<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>设置</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 32px auto; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
  button { margin-top: 18px; padding: 10px 28px; font-size: 15px; }
</style></head>
<body>
  <h2>AReader</h2>
  <label>Base URL</label>
  <input id="apiBase" placeholder="https://api.openai.com/v1">
  <input id="apiKey" type="password" autocomplete="off">
  <label>模型</label>
  <input id="model" placeholder="gpt-4o-mini">
  <label>提示词</label>
  <textarea id="prompt" rows="3"></textarea>
  <label>Edge TTS 语音</label>
  <select id="voice">
    <option value="zh-CN-XiaoxiaoNeural">晓晓（女）</option>
    <option value="zh-CN-YunxiNeural">云希（男）</option>
    <option value="zh-CN-YunjianNeural">云健（男）</option>
    <option value="zh-CN-XiaoyiNeural">晓伊（女）</option>
    <option value="en-US-AriaNeural">Aria (英语)</option>
  </select>
  <label style="font-weight:normal"><input id="confirmBeforeSend" type="checkbox" style="width:auto"> 发送截图前先预览确认</label>
  <label style="font-weight:normal"><input id="lanPushEnabled" type="checkbox" style="width:auto"> 推送识别结果到内网服务器</label>
  <label>内网服务器地址</label>
  <input id="lanServerUrl" placeholder="http://127.0.0.1:8222/ingest">
  <button id="save">保存</button>
  <button id="testTts" type="button">试听语音</button>
  <button id="stopTts" type="button">停止朗读</button>
  <span id="msg"></span>
  <p><a href="history.html" target="_blank">查看本机历史记录</a>）</p>
  <script src="options.js"></script>
</body>
</html>
